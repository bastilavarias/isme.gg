plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}
// Release identity is permanent. Never fall back to the debug signing key.
def releaseKeys = new Properties()
def releaseKeysFile = rootProject.file("key.properties")
if (releaseKeysFile.exists()) {
    releaseKeysFile.withInputStream { releaseKeys.load(it) }
}
def releaseStore = System.getenv("ISME_KEYSTORE_PATH") ?: releaseKeys.getProperty("storeFile")
def releaseStorePassword = System.getenv("ISME_KEYSTORE_PASSWORD") ?: releaseKeys.getProperty("storePassword")
def releaseAlias = System.getenv("ISME_KEY_ALIAS") ?: releaseKeys.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("ISME_KEY_PASSWORD") ?: releaseKeys.getProperty("keyPassword")
def releaseSigningReady = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }

android {
    namespace "gg.isme.tv"
    compileSdk 36
    ndkVersion flutter.ndkVersion
    defaultConfig {
        applicationId "gg.isme.tv.flutter"
        minSdk 28
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        buildConfigField "String", "RELEASE_REPO", '""'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile rootProject.file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix ".debug" }
        release {
            buildConfigField "String", "RELEASE_REPO", '"bastilavarias/isme.gg"'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    packaging { resources.excludes += ["/META-INF/{AL2.0,LGPL2.1}"] }
}
// Debug/emulator builds remain independent of release credentials.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase(java.util.Locale.ROOT).contains("release") &&
        (it.name.startsWith("assemble") || it.name.startsWith("bundle") || it.name.startsWith("package")) }) {
        if (!releaseSigningReady || !rootProject.file(releaseStore).isFile()) {
            throw new GradleException("Release signing is required. Configure android/key.properties or ISME_KEYSTORE_* / ISME_KEY_* environment variables.")
        }
    }
}
flutter { source "../.." }
dependencies {
    implementation "androidx.core:core:1.16.0"
    implementation "org.libtorrent4j:libtorrent4j:2.1.0-39"
    implementation "org.libtorrent4j:libtorrent4j-android-arm64:2.1.0-39"
    implementation "org.libtorrent4j:libtorrent4j-android-arm:2.1.0-39"
}
