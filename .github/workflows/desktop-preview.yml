name: Desktop preview checks
on:
  workflow_dispatch:
  push:
    branches: ['desktop/build-*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter pin
        id: sdk
        shell: pwsh
        run: |
          $pin = Get-Content toolchain.json -Raw | ConvertFrom-Json
          "flutter=$($pin.flutter)" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter }}
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: desktop/native-engine/pom.xml
      - name: Generate runner, validate, and compile desktop preview
        shell: pwsh
        run: ./setupdesktop.ps1 -Build
      - uses: actions/upload-artifact@v4
        with:
          name: ismegg-windows-preview
          path: desktop/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 7
