name: Android release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version (X.Y.Z)
        required: true
        type: string
      version_code:
        description: Increasing Android versionCode
        required: true
        type: string
      publish:
        description: Publish to public GitHub Releases (requires release environment approval)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-signing
    steps:
      - uses: actions/checkout@v4
      - name: Read shared toolchain
        id: toolchain
        run: python3 tools/check_toolchain.py --github-output
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.toolchain.outputs.flutter }}
          channel: stable
      - name: Verify Flutter and configure the shared JDK
        run: |
          python3 tools/check_toolchain.py --check-flutter
          flutter config --jdk-dir="$JAVA_HOME"
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          CODE: ${{ inputs.version_code }}
        run: |
          python3 -c '
          import os, re
          from pathlib import Path
          version, code = os.environ["VERSION"], os.environ["CODE"]
          part = r"(?:0|[1-9][0-9]*)"
          assert re.fullmatch(r"\.".join([part] * 3), version), "Expected a stable X.Y.Z version"
          assert re.fullmatch(r"[1-9][0-9]*", code) and int(code) <= 2100000000, "Invalid versionCode"
          assert f"version: {version}+{code}" in Path("pubspec.yaml").read_text().splitlines(), "Workflow version must match pubspec.yaml"
          '
      - name: Require version-specific What's New content
        run: python3 tools/check_whats_new.py
      - name: Prepare build
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-${{ steps.toolchain.outputs.androidSdk }}" "build-tools;${{ steps.toolchain.outputs.androidBuildTools }}"
          scaffold="$(mktemp -d)"
          trap 'rm -rf "$scaffold"' EXIT
          flutter create --no-pub --platforms=android --project-name ismegg --org gg.isme "$scaffold"
          cp "$scaffold/android/gradlew" android/
          cp "$scaffold/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          chmod +x android/gradlew
          dart tools/prepare_fonts.dart
          if git ls-files --error-unmatch pubspec.lock >/dev/null 2>&1; then flutter pub get --enforce-lockfile; else flutter pub get; fi
          python3 tools/check_toolchain.py --clean
      - name: Regression tests
        run: |
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub
          python3 -B -m unittest discover -s tools -p 'test_*.py'
          python3 tools/check_toolchain.py --clean
      - name: Build signed ARM APK and verify
        env:
          KEYSTORE_BASE64: ${{ secrets.ISME_KEYSTORE_BASE64 }}
          ISME_KEYSTORE_PASSWORD: ${{ secrets.ISME_KEYSTORE_PASSWORD }}
          ISME_KEY_ALIAS: ${{ secrets.ISME_KEY_ALIAS }}
          ISME_KEY_PASSWORD: ${{ secrets.ISME_KEY_PASSWORD }}
          SIGNER_SHA256: ${{ vars.ISME_SIGNER_SHA256 }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          VERSION: ${{ inputs.version }}
          CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_RELEASE" = "true" ] && [ -z "$TMDB_READ_TOKEN" ] && [ -z "$TMDB_API_KEY" ]; then
            echo "Configure TMDB_API_KEY or TMDB_READ_TOKEN before publishing a public build."
            exit 1
          fi
          umask 077
          export ISME_KEYSTORE_PATH="$RUNNER_TEMP/isme-release.jks"
          trap 'rm -f "$ISME_KEYSTORE_PATH"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ISME_KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          flutter build apk --release --no-pub --target-platform android-arm,android-arm64 --build-name "$VERSION" --build-number "$CODE"
          python3 tools/check_toolchain.py --clean
          apk=build/app/outputs/flutter-apk/app-release.apk
          callback='SwigDirector_alert_notify_callback_on_alert(Lorg/libtorrent4j/swig/alert_notify_callback;)V'
          # The native library loads even when R8 has removed this Java upcall.
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code \
            --class org.libtorrent4j.swig.libtorrent_jni --method "$callback" "$apk" \
            | grep -F "$callback" >/dev/null
          python3 tools/release_metadata.py --apk "$apk" --output "$RUNNER_TEMP/release" --version "$VERSION" --code "$CODE" --aapt2 "$ANDROID_HOME/build-tools/${{ steps.toolchain.outputs.androidBuildTools }}/aapt2" --apksigner "$ANDROID_HOME/build-tools/${{ steps.toolchain.outputs.androidBuildTools }}/apksigner" --signer "$SIGNER_SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: isme-android-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-public-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: isme-android-release
          path: release
      - name: Verify and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          CODE: ${{ inputs.version_code }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS.txt)
          python3 -c 'import json,os; d=json.load(open("release/update.json")); assert d["version"]==os.environ["VERSION"] and d["versionCode"]==int(os.environ["CODE"])'
          # Check every public stable release, including releases not marked latest.
          tags="$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq '.[] | select(.draft==false and .prerelease==false) | .tag_name')"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release download "$tag" --pattern update.json --output "$RUNNER_TEMP/previous-update.json" --clobber
            PRIOR_TAG="$tag" python3 -c '
          import json, os, re
          from pathlib import Path
          tag = os.environ["PRIOR_TAG"]
          prior = json.loads((Path(os.environ["RUNNER_TEMP"]) / "previous-update.json").read_text())
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) and prior["version"] == tag[1:], f"Invalid prior release metadata for {tag}"
          version = lambda value: tuple(map(int, value.split(".")))
          assert version(os.environ["VERSION"]) > version(prior["version"]), f"Version must be newer than {tag}"
          assert type(prior["versionCode"]) is int and 0 < prior["versionCode"] < int(os.environ["CODE"]), f"versionCode must increase beyond {tag}"
          '
          done <<< "$tags"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to reuse it." >&2
            exit 1
          fi
          notes=(--generate-notes)
          if [ -f "releases/v$VERSION.md" ]; then
            notes=(--notes-file "releases/v$VERSION.md")
          fi
          gh release create "v$VERSION" release/isme.apk release/update.json release/SHA256SUMS.txt --target "$COMMIT" --title "isme.gg v$VERSION" "${notes[@]}" --latest
