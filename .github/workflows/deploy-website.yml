name: Deploy isme.gg website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/website_releases.py'
      - 'tools/test_website_releases.py'
      - '.github/workflows/deploy-website.yml'
  # Releases made with GITHUB_TOKEN don't trigger another release workflow.
  # Refresh after the Android workflow finishes (build-only runs are harmless).
  workflow_run:
    workflows: [Android release candidate]
    types: [completed]
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: isme-website
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Build curated website and public release feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools -p 'test_website_releases.py'
          mkdir -p site/assets/screenshots
          cp web/index.html web/robots.txt web/sitemap.xml web/llms.txt site/
          cp web/assets/releases.js site/assets/
          cp web/assets/screenshots/tv-home.png web/assets/screenshots/tv-showcase.png site/assets/screenshots/
          python3 tools/website_releases.py --output site/assets/releases.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
