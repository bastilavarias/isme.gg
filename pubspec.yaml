name: ismegg
description: isme.gg native cinema client for Android TV and phones
publish_to: none
version: 2.0.1+18
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.1'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  video_player: 2.11.1
  video_player_android: 2.9.1
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
